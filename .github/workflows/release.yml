name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor low, so the Linux binaries run on older distros too.
          - { os: ubuntu-22.04, target: linux-amd64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-amd64 }
          - { os: windows-latest, target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf

      - name: Check the C compiler
        run: gcc --version | head -1

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        run: scripts/package.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}"

      - name: Smoke test, outside the Go module cache
        run: |
          dir="dist/titties-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          # The packaged binary must find its libraries without the module cache it was built from.
          mv "$(go env GOMODCACHE)" "$RUNNER_TEMP/gomodcache-hidden"
          exe="$dir/titties"; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" version
          "$exe" say -o smoke.wav "ciao, questa è una prova"
          test "$(wc -c < smoke.wav)" -gt 10000
          mv "$RUNNER_TEMP/gomodcache-hidden" "$(go env GOMODCACHE)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titties-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > checksums.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
